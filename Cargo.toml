[workspace]
# src-tauri se agrega en el módulo 10 (requiere webkit2gtk-4.1 instalado).
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
aho-corasick = "1.1"
deunicode = "1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.clippy]
unwrap_used = "warn"
