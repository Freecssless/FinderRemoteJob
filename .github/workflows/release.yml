# Instaladores para Windows (.exe NSIS y .msi) y Linux (.deb, .rpm, AppImage).
# Se ejecuta al subir una etiqueta `v*` (p. ej. `git tag v0.1.0 && git push --tags`) o a mano
# desde la pestaña Actions. Deja un borrador de versión en GitHub con los instaladores adjuntos.
name: Instaladores

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: FinderRemoteJob ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseDraft: true
