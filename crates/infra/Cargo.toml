[package]
name = "finder-infra"
description = "Infraestructura de FinderRemoteJob: SQLite, LLM, fuentes de vacantes, PDF/DOCX."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
finder-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.13", features = ["json"] }
quick-xml = { version = "0.42", features = ["serialize"] }
scraper = "0.29"
pdf-extract = "0.12"
docx-rs = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] } # medir el DOCX antes de abrirlo (anti-bombas)
typst-as-lib = { version = "0.17", default-features = false }
typst = "0.15"
typst-pdf = "0.15"
typst-layout = "0.15" # PagedDocument (ya lo trae typst)
ego-tree = "0.11" # ya lo trae scraper; se declara para recorrer el árbol HTML
thiserror.workspace = true
uuid = { version = "1.18", features = ["v7"] }
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tokio = { version = "1", features = ["time"] } # pausa entre reintentos de la IA (ya lo trae sqlx)

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
